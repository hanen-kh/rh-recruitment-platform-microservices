server:
  port: 8082

app:
  tika-server-url: ${TIKA_SERVER_URL:http://localhost:9998}
  cv-storage-directory: uploads/cvs
  tika:
    connect-timeout: ${TIKA_CONNECT_TIMEOUT:5s}
    read-timeout: ${TIKA_READ_TIMEOUT:2m}
  ollama:
    connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:5s}
    read-timeout: ${OLLAMA_READ_TIMEOUT:5m}
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/micro}
  datasource:
    url: jdbc:mysql://localhost:3305/employee_cv_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2:3b}

