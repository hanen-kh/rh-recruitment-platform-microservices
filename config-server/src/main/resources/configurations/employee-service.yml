server:
  port: 8005
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/micro}
  datasource:
    url: jdbc:mysql://localhost:3311/employees_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: rootpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  grpc:
    server:
      port: 9090

keycloak:
  admin:
    server-url: http://localhost:8088
    realm: micro
    client-id: hr-admin-client
    client-secret: ${KEYCLOAK_ADMIN_SECRET}