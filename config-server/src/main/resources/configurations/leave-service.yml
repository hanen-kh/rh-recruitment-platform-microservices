server:
  port: 8006
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/micro}
  datasource:
    url: jdbc:mysql://localhost:3308/leave_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: rootpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  main:
    # Autorise un starter à écraser la définition de l'autre pour débloquer le démarrage
    allow-bean-definition-overriding: true
  grpc:
    client:
      channel:
        employee-service:
          target: static://localhost:9090
